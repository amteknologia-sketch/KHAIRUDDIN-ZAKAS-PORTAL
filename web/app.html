<!DOCTYPE html>
<html lang="id" data-theme="terang">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="alhuda-app" content="2.10.0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ALHUDA MOBILE</title>
<style>
:root{--bg:#f1f1f1;--card:#ffffff;--pri:#10b981;--pri2:#0f6e4f;--soft:#e7f6ef;--line:#e5e7eb;--text:#1f2937;--sub:#6b7280;--chip:#eef2f0;--warn:#fff6d8;--warnb:#f2d27a;--warnt:#7a5b00;--ok:#059669;--danger:#dc2626;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
[data-theme=gelap]{--bg:#0e1412;--card:#17201d;--pri:#34d399;--pri2:#065f46;--soft:#1b2c26;--line:#28362f;--text:#e6eeea;--sub:#95a7a0;--chip:#22302b;--warn:#332c17;--warnb:#6d5a1e;--warnt:#f3d98a;--shadow:none}
[data-theme=pink]{--pri:#ec4899;--pri2:#9d174d;--soft:#fdeef6;--chip:#f9e8f1}
[data-theme=merah]{--pri:#ef4444;--pri2:#991b1b;--soft:#fdecec;--chip:#f8e9e9}
[data-theme=putih]{--bg:#ffffff;--card:#ffffff;--pri:#10b981;--pri2:#1f2937;--soft:#f3f4f6;--chip:#f3f4f6;--line:#e5e7eb;--shadow:0 0 0 1px #e5e7eb}
[data-theme=biru]{--pri:#3b82f6;--pri2:#1e3a8a;--soft:#eaf1fe;--chip:#e9eef8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px}
body{overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:640px){html{background:#dfe6e2}[data-theme=gelap]{background:#070a09}html body{background:transparent}.app{box-shadow:0 0 0 1px rgba(0,0,0,.05),0 10px 40px rgba(0,0,0,.12)}}
.hide{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- Top bar ---------- */
.top{background:var(--pri2);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:56px;flex:none}
.top .tt{flex:1;min-width:0}
.top .t1{font-weight:800;letter-spacing:.4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t2{font-size:10.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;position:relative;cursor:pointer}
.badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--pri2)}
/* ---------- View ---------- */
.view{flex:1;overflow-y:auto;padding:14px 14px 90px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sec h3{margin:0;font-size:14.5px}
.link{color:var(--pri);font-weight:600;font-size:12.5px;background:none;border:0;cursor:pointer;padding:4px}
.muted{color:var(--sub)}.small{font-size:12px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Banner */
.banner{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-radius:20px;padding:16px;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.banner .hi{font-size:12px;opacity:.9}.banner .nm{font-size:18px;font-weight:800;margin:2px 0}
.banner .un{font-size:12px;opacity:.85}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:rgba(255,255,255,.18);padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600}
.banner .dt{margin-top:10px;font-size:11.5px;opacity:.9;display:flex;gap:6px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:40px;height:40px;font-size:14px;background:var(--soft);color:var(--pri2)}
[data-theme=gelap] .av.sm{color:var(--pri)}
/* Quick */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qa{background:var(--card);border:0;border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;position:relative;text-align:center}
.qa .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--pri2)}
[data-theme=gelap] .qa .ic{color:var(--pri)}
.qa .badge{top:4px;right:12px;border-color:var(--card)}
/* Stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.stat .v{font-size:20px;font-weight:800;line-height:1.1}.stat .l{font-size:11px;color:var(--sub)}
.c1{background:#e0f2fe;color:#0369a1}.c2{background:#ede9fe;color:#6d28d9}.c3{background:#dcfce7;color:#15803d}.c4{background:#ffedd5;color:#c2410c}
[data-theme=gelap] .c1,[data-theme=gelap] .c2,[data-theme=gelap] .c3,[data-theme=gelap] .c4{background:#22302b}
/* Kas */
.kas{background:var(--warn);border:1px solid var(--warnb);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;color:var(--warnt)}
.kas .v{font-size:21px;font-weight:800;color:var(--text)}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.svc .s{border-radius:14px;padding:11px 9px;cursor:pointer;border:0;text-align:left}
.svc .s .l{font-size:10.5px;opacity:.8}.svc .s .v{font-weight:800;font-size:13px;margin-top:3px}
.p1{background:#e6f6ee;color:#065f46}.p2{background:#eaf0fd;color:#1e40af}.p3{background:#fdeef3;color:#9d174d}
[data-theme=gelap] .p1,[data-theme=gelap] .p2,[data-theme=gelap] .p3{background:#22302b;color:var(--text)}
.ann{border-left:4px solid var(--pri);}
.tunggak{margin-top:12px;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;line-height:1.5;font-size:13px}
.tunggak .ic{width:38px;height:38px;border-radius:11px;background:#ffedd5;color:#c2410c;display:grid;place-items:center;flex:none}
[data-theme=gelap] .tunggak{background:#2f2014;border-color:#7c2d12;color:#fed7aa}
.notif-btn{width:100%;margin-top:12px;border:0;background:var(--card);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);cursor:pointer;border-left:4px solid #f59e0b}
.notif-btn .ic{position:relative;width:42px;height:42px;border-radius:12px;background:#fef3c7;color:#b45309;display:grid;place-items:center;flex:none}
.notif-btn .badge{border-color:var(--card)}
.nsec{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin:12px 0 4px}
.nsec .c{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--sub)}
.nsec .c.on{background:#fee2e2;color:#b91c1c}
.nit{padding:7px 0 7px 26px;border-bottom:1px dashed var(--line);font-size:12.5px}.nit:last-child{border-bottom:0}
.dayh{display:flex;align-items:baseline;gap:8px;margin:16px 2px 8px}.dayh b{font-size:15px}
.ann .h{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--pri2)}
[data-theme=gelap] .ann .h{color:var(--pri)}
/* Bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);display:flex;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--sub);padding:4px 0;cursor:pointer;font-weight:600}
.nav button .pill{width:52px;height:28px;border-radius:14px;display:grid;place-items:center}
.nav button.on{color:var(--pri2)}
[data-theme=gelap] .nav button.on{color:var(--pri)}
.nav button.on .pill{background:var(--soft)}
/* Tabs/chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:20px;white-space:nowrap;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--sub)}
.chip.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
/* Lists */
.list .it{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:600}.list .it .s{font-size:12px;color:var(--sub);margin-top:1px}
.pillx{display:inline-block;background:var(--chip);color:var(--sub);font-size:10.5px;padding:3px 8px;border-radius:10px;font-weight:600;margin:2px 3px 0 0}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px}
.st.H,.st.ok{background:#dcfce7;color:#15803d}.st.I{background:#e0f2fe;color:#0369a1}.st.S{background:#fef3c7;color:#b45309}.st.A,.st.no{background:#fee2e2;color:#b91c1c}.st.w{background:#fef3c7;color:#b45309}
/* Forms */
.f{margin-bottom:12px}.f label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none;font-size:14px}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.in[readonly],.in:disabled{background:var(--chip);color:var(--sub)}
textarea.in{min-height:90px;resize:vertical}
.btn{border:0;background:var(--pri2);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%}.btn.sec{background:var(--soft);color:var(--pri2)}.btn.red{background:#fee2e2;color:#b91c1c}.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
[data-theme=gelap] .btn.sec{color:var(--pri)}
.btn:disabled{opacity:.6}
.fab{position:absolute;right:16px;bottom:84px;width:54px;height:54px;border-radius:18px;background:var(--pri2);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:4;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;color:var(--text);margin:0;font-weight:500;cursor:pointer}
.checks input{accent-color:var(--pri2)}
.phead{padding:16px}
.pchat{width:46px;height:46px;border-radius:14px;border:0;background:var(--pri2);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.plist{padding:4px 14px}
.prow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.prow:last-child{border-bottom:0}
.prow .pl{width:42%;min-width:120px;font-size:12px;color:var(--sub);font-weight:600}.prow .pv2{flex:1;min-width:0;font-size:13.5px;overflow-wrap:break-word}
.pvtag{font-size:10px;font-weight:700;color:#b45309;background:#fef3c7;border-radius:8px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.pbtn{border:0;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:#fff}
.pbtn svg{width:15px;height:15px}.pbtn.wa{background:#25d366}.pbtn.ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}
.galeri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.galeri button,.galeri .gi{aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--chip);cursor:pointer;position:relative}
.galeri img{width:100%;height:100%;object-fit:cover;display:block}
.gi button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:12px;cursor:pointer}
.pvsw{display:inline-flex;background:var(--chip);border-radius:10px;padding:2px;flex:none}
.pvsw button{border:0;background:none;font-size:11px;font-weight:700;padding:5px 8px;border-radius:8px;color:var(--sub);cursor:pointer;white-space:nowrap}
.pvsw button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:86vh;object-fit:contain}
.lightbox .lb{position:absolute;background:rgba(255,255,255,.15);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
.lightbox .l{left:10px;top:50%}.lightbox .r{right:10px;top:50%}.lightbox .x{right:12px;top:14px;font-size:16px}
.lightbox .lbn{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:12px;opacity:.8}
.pick{display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;min-height:46px}.pick svg{color:var(--sub);width:18px;height:18px}
.pkscrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:22;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.pkscrim .sheet{max-height:88vh}
.pw{position:relative}.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--sub);padding:8px;cursor:pointer}
/* Absen toggles */
.tg{display:flex;gap:4px}
.tg button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:12px;color:var(--sub);cursor:pointer}
.tg button.on.H{background:#16a34a;color:#fff;border-color:#16a34a}.tg button.on.I{background:#0284c7;color:#fff;border-color:#0284c7}
.tg button.on.S{background:#d97706;color:#fff;border-color:#d97706}.tg button.on.A{background:#dc2626;color:#fff;border-color:#dc2626}
/* Rekap ring */
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-size:19px}
.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.mini4 div{background:var(--chip);border-radius:10px;padding:8px 4px;text-align:center}.mini4 b{display:block;font-size:16px}.mini4 span{font-size:10.5px;color:var(--sub)}
/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--soft);color:var(--pri2);padding:8px 6px;text-align:left;font-size:11.5px}
[data-theme=gelap] .tbl th{color:var(--pri)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl .c{text-align:center}.tbl .r{text-align:right}
/* Month grid */
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mo{border-radius:12px;padding:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.mo .n{font-weight:700;font-size:12.5px}.mo .a{font-size:11px;color:var(--sub);margin-top:3px}
.mo.lunas{background:#dcfce7;border-color:#86efac}.mo.kurang{background:#fef3c7;border-color:#fcd34d}
[data-theme=gelap] .mo.lunas{background:#14361f}[data-theme=gelap] .mo.kurang{background:#3a2f12}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}.bar>div{height:100%;background:var(--pri)}
/* Sheet/modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet .sh{display:flex;align-items:center;padding:14px 16px 8px;gap:8px}.sheet .sh h3{margin:0;flex:1;font-size:16px}
.sheet .sb{padding:6px 16px 22px;overflow-y:auto}
.xb{background:var(--chip);border:0;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
.nbanner{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(440px,94%);display:flex;align-items:center;gap:12px;background:var(--card);color:var(--text);padding:12px 14px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:80;cursor:pointer;animation:nbIn .25s ease-out;transition:opacity .4s,transform .4s}
.nbanner.out{opacity:0;transform:translate(-50%,-30px)}
.nbanner .nic{width:38px;height:38px;border-radius:11px;background:var(--pri2);color:#fff;display:grid;place-items:center;flex:none}.nbanner .nic svg{width:19px;height:19px}
.nbanner b{display:block;font-size:13.5px}.nbanner .grow span{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes nbIn{from{transform:translate(-50%,-40px);opacity:0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;z-index:40;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fd .2s}
.toast.err{background:#b91c1c}.toast.ok{background:#047857}
.net{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;flex:none;cursor:pointer}
.net svg{width:16px;height:16px}
.net.off{background:#374151;color:#fff}.net.sync{background:#dbeafe;color:#1e3a8a}.net.err{background:#fee2e2;color:#991b1b}
.bb.pend{opacity:.85}
.spin{display:inline-block;width:10px;height:10px;border:1.6px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-1px;margin-left:3px}
@keyframes rot{to{transform:rotate(360deg)}}
.inst{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.14);border:1px solid var(--line)}
.inst img{width:42px;height:42px;border-radius:11px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.inst .x{background:none;border:0;color:var(--sub);padding:6px;cursor:pointer;display:grid;place-items:center}
.inst-float{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 24px);max-width:496px;z-index:15;animation:up .25s ease-out}
.prog{position:fixed;top:0;left:0;height:3px;background:var(--pri);z-index:50;width:0;transition:width .3s}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:6px}
.sk{background:linear-gradient(90deg,var(--chip),var(--card),var(--chip));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px;height:70px;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
/* Login */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:0 0 28px;background:var(--bg)}
.login .hd{background:var(--pri2);padding:calc(56px + 6vh) 24px 64px;border-radius:0 0 32px 32px}
.login .card{margin:-44px 20px 0}

/* ---------- util ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Math.round(+n || 0).toLocaleString('id-ID');
const JN = ['NIP', 'NIDN', 'NUPTK'];
const BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const pad2 = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function monthStr() { return todayStr().slice(0, 7); }
function tgl(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[3]) + ' ' + BLN[+m[2] - 1].slice(0, 3) + ' ' + m[1] : (s || '-'); }
function jam(s) { const m = String(s || '').match(/(\d{2}:\d{2})/); return m ? m[1].replace(':', '.') : ''; }
function inisial(n) { return String(n || '?').replace(/^(tgk\.?|m\.|t\.)\s*/i, '').split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase(); }
function avatar(u, cls) { return '<div class="av ' + (cls || '') + '">' + (u && u.foto ? '<img src="' + esc(u.foto) + '" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=\'' + esc(inisial(u.nama)) + '\'">' : esc(inisial(u && u.nama))) + '</div>'; }
const REG = []; const reg = o => (REG.push(o), REG.length - 1);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return S.mem[k] || null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { S.mem[k] = v; } }
};
const BR = window.AndroidBridge || null;

/* ---------- sebutan lembaga: kata "dayah" diganti di seluruh tampilan ---------- */
function istilahLembaga() {
  const s = setSumber(); let v = s && s.istilah_lembaga; if (!v) v = store.get('alhuda_istilah_lembaga');
  v = String(v || '').trim(); return v && (v.toLowerCase() === 'dayah' || !/dayah/i.test(v)) ? v : 'Dayah';
}
const GK = { t: 'Dayah', mo: null, re: /(^|[^A-Za-z0-9_@.\/-])(dayah)(?![A-Za-z0-9_@])/gi };
/** Ganti "dayah" (kata utuh; bukan bagian email / tautan / nama kunci) dengan sebutan lembaga, mengikuti huruf besar-kecilnya. */
function gantiKata(str) {
  const t = GK.t; if (!str || t.toLowerCase() === 'dayah' || !/dayah/i.test(str)) return str;
  return str.replace(GK.re, (a, pre, m) => pre + (m === 'DAYAH' ? t.toUpperCase() : m.charAt(0) === 'D' ? t.charAt(0).toUpperCase() + t.slice(1) : t.toLowerCase()));
}
const GK_LEWAT = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1 };
function gkTeks(n) {
  const p = n.parentNode; if (!p || GK_LEWAT[p.nodeName] || (p.closest && p.closest('[contenteditable],.noganti'))) return;
  const v = n.nodeValue, b = gantiKata(v); if (b !== v) n.nodeValue = b;
}
function gkAttr(x) { ['placeholder', 'title', 'aria-label'].forEach(a => { const v = x.getAttribute(a); if (v && /dayah/i.test(v)) x.setAttribute(a, gantiKata(v)); }); }
function gkEl(el) {
  if (GK_LEWAT[el.nodeName] || (el.closest && el.closest('.noganti'))) return;
  if (el.getAttribute) gkAttr(el);
  if (el.querySelectorAll) el.querySelectorAll('[placeholder],[title],[aria-label]').forEach(x => { if (!x.closest('.noganti')) gkAttr(x); });
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), L = []; let n;
  while ((n = w.nextNode())) if (/dayah/i.test(n.nodeValue)) L.push(n);
  L.forEach(gkTeks);
}
function mulaiGantiKata() {
  GK.t = istilahLembaga();
  if (GK.t.toLowerCase() === 'dayah') { if (GK.mo) { GK.mo.disconnect(); GK.mo = null; } return; }
  gkEl(document.documentElement);
  if (GK.mo) return;
  GK.mo = new MutationObserver(ms => ms.forEach(m => {
    if (m.type === 'characterData') gkTeks(m.target);
    else m.addedNodes.forEach(n => n.nodeType === 3 ? gkTeks(n) : n.nodeType === 1 && gkEl(n));
  }));
  GK.mo.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
}

/** Unduh semua data ke perangkat (sekali). Ikon unduh + angka progres tampil di header. */
async function unduhSemua() {
  if (S.sinkronJalan || !S.B || !S.token || !isOnline()) return;
  S.sinkronJalan = true; S.syncN = 0; S.syncTot = 0; setSync(1);
  let gagalJaringan = false, berubah = false;
  const jalankan = async list => {
    const sudah = S.unduhSudah || (S.unduhSudah = {});
    list = list.filter(x => { const k = ckey(x[0], x[1]); if (sudah[k]) return false; sudah[k] = 1; return true; });
    S.syncTot += list.length; setSync(0);
    const batch = []; for (let i = 0; i < list.length; i += 20) batch.push(list.slice(i, i + 20));
    let bi = 0;
    const worker = async () => {
      while (bi < batch.length && !gagalJaringan) {
        const b = batch[bi++];
        if (!S.B || !isOnline()) { gagalJaringan = true; return; }
        try {
          const res = await rawApi('sync.batch', { items: b }, true);
          res.forEach((r, i) => {
            if (!r || !r.ok) return;
            const [a, p] = b[i], k = ckey(a, p), lama = cgetRaw(k), d = withPending(a, p, r.data);
            if (lama !== JSON.stringify(d)) { cset(k, d, a, p); if (lama) berubah = true; if (a === 'boot') S.B = d; }
            S.fetchedAt[k] = Date.now();

        } catch (e) { if (e.net) { gagalJaringan = true; return; } b.forEach(x => delete sudah[ckey(x[0], x[1])]); }
        S.syncN += b.length; setSync(0);
      }
    };
    await Promise.all([worker(), worker()]);
  };
  try {
    if (hasPending()) await flush();
    await jalankan(daftarUnduh());
    if (!gagalJaringan) await jalankan(daftarUnduh2());
    if (!gagalJaringan) { store.set(unduhKunci(), APP_VER); S.unduhSudah = null; toast('Semua data sudah tersimpan di perangkat.', 'ok'); }
    if (berubah) { try { topBar(); const nb = $('#nbrand'); if (nb) nb.innerHTML = brandHtml(); } catch (e) {} softRefresh(); }
  } catch (e) {}
  setSync(-1); S.sinkronJalan = false;
}

/** Gabungkan baris roster yang mapel & gurunya sama (beda hari) menjadi satu entri. */
function rosterGrup(rows) {
  const urut = h => { const i = S.B.hari.indexOf(h); return i < 0 ? 99 : i; };
  const m = {}, out = [];
  rows.forEach(r => {
    const k = String(r.mapel).trim().toLowerCase() + '|' + String(r.guru).toLowerCase();
    if (!m[k]) { m[k] = { kelas: r.kelas, sesi: r.sesi, mapel: r.mapel, guru: r.guru, guruNama: r.guruNama, rows: [] }; out.push(m[k]); }
    m[k].rows.push(r);
  });
  out.forEach(g => {
    g.rows.sort((a, b) => urut(a.hari) - urut(b.hari));
    g.hari = g.rows.map(r => r.hari);
    g.utama = g.rows.find(r => r.hari === 'Setiap Hari' || r.hari === namaHari()) || g.rows[0];
  });
  return out;
}

function lihatFoto(i) {
  const g = S.ui.galeri || []; if (!g.length) return;
  const ov = document.createElement('div'); ov.className = 'lightbox';
  const draw = () => { ov.innerHTML = '<img src="' + esc(g[i].url) + '" referrerpolicy="no-referrer"><div class="lbn">' + (i + 1) + ' / ' + g.length + '</div>' +
    (g.length > 1 ? '<button class="lb l">‹</button><button class="lb r">›</button>' : '') + '<button class="lb x">✕</button>'; };
  draw(); document.body.appendChild(ov);
  ov.addEventListener('click', e => {
    if (e.target.classList.contains('l')) { i = (i - 1 + g.length) % g.length; draw(); }
    else if (e.target.classList.contains('r')) { i = (i + 1) % g.length; draw(); }
    else ov.remove();
  });
}

function renderGaleriEdit() {
  const g = S.ui.galeriEdit || [], el = $('#gedit'); if (!el) return;
  el.innerHTML = g.length ? g.map(x => '<div class="gi"><img src="' + esc(x.url) + '" referrerpolicy="no-referrer" onerror="this.style.opacity=.2"><button onclick="hapusGaleri(\'' + esc(x.id) + '\')" title="Hapus">✕</button></div>').join('') : '<div class="small muted" style="grid-column:1/-1;padding:8px 2px">Belum ada foto.</div>';

function kompres(file, max, q) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => { const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; img.onerror = () => rej(new Error('File bukan gambar yang valid.')); img.src = rd.result; };
    rd.readAsDataURL(file);
  });
}
async function tambahGaleri(input) {
  const files = Array.from(input.files || []); input.value = '';
  for (const f of files) {
    try {
      const data = await kompres(f, 1280, .85);
      const r = await run(() => api('profil.galeriAdd', { target: S.ui.editTarget, data: data }));
      S.ui.galeriEdit.push({ id: r.id, url: data }); renderGaleriEdit();
    } catch (e) { break; }
  }
  if (files.length) { toast('Foto ditambahkan ke galeri.', 'ok'); S.fetchedAt = {}; }
}
async function hapusGaleri(id) {
  if (!(await ask('Hapus foto ini dari galeri?', 'Hapus'))) return;
  try { await run(() => api('profil.galeriDelete', { target: S.ui.editTarget, id: id }), 'Foto dihapus.'); S.ui.galeriEdit = S.ui.galeriEdit.filter(x => x.id !== id); renderGaleriEdit(); S.fetchedAt = {}; } catch (e) {}
}

    tahun_masuk: val('bt'), kelas_masuk: val('bm'), wa: val('bwa'), ig: val('big'), nama_ortu: val('bo'), bio: val('bbio'), privasi: privasi };

function unggahLogo(jenis, input) {
  const f = input.files && input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = async () => {
      const max = 600, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const png = /png|webp/.test(f.type);
      const data = c.toDataURL(png ? 'image/png' : 'image/jpeg', .9);
      try { await run(() => api('logo.upload', { jenis: jenis, data: data }), 'Logo berhasil diganti.'); S.B = await api('boot', {}, true); refresh(); } catch (e) {}
    };
    img.onerror = () => toast('File bukan gambar yang valid.', 'err');
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
async function resetLogo(jenis) {
  if (!(await ask(jenis === 'dayah' ? 'Kembalikan ke logo bawaan?' : 'Hapus logo ini? Kop PDF akan memakai logo Dayah.', 'Ya'))) return;
  try { await run(() => api('logo.reset', { jenis: jenis }), 'Logo dikembalikan.'); S.B = await api('boot', {}, true); refresh(); } catch (e) {}
}

let installPrompt = null;
let pernahPrompt = false;   // browser menawarkan instal → aplikasi belum terpasang
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; pernahPrompt = true; showInstallBar(); });
window.addEventListener('appinstalled', () => { installPrompt = null; store.set('alhuda_installed', '1'); hideInstallBar(); toast(appName() + ' berhasil dipasang.', 'ok'); });
/** Pemberitahuan "Instal" di halaman depan (login & Beranda) — hanya versi web yang belum dipasang. */
function bisaInstal() {
  if (BR || HAS_GAS) return false;
  if ((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone) return false;
  if (store.get('alhuda_installed') === '1') return false;
  // Chrome/Edge hanya memicu "beforeinstallprompt" bila aplikasi BELUM terpasang → tanpa itu, anggap sudah terpasang
  if ('onbeforeinstallprompt' in window && !installPrompt && !pernahPrompt) return false;
  return true;   // tidak dapat ditutup: tampil terus sampai aplikasi dipasang
}
function installHtml(cls) {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return '<div class="inst ' + (cls || '') + '" id="instBar"><img src="icons/icon-192.png" onerror="this.outerHTML=LOGO_SVG.replace(\'width:90%;height:90%\',\'width:42px;height:42px\')" alt="">' +
    '<div class="grow"><div class="b" style="font-size:13.5px">Pasang ' + esc(appName()) + '</div><div class="small muted">' +
    (ios ? 'Tambahkan ke Layar Utama agar terbuka seperti aplikasi.' : 'Instal di perangkat ini — lebih cepat & bisa offline.') + '</div></div>' +
    '<button class="btn sm" onclick="pasangApp()">' + (ios ? 'Caranya' : 'Instal') + '</button></div>';
}
function showInstallBar() {
  if (!bisaInstal() || $('#instBar')) return;
  if ($('.login .card')) { const d = document.createElement('div'); d.innerHTML = installHtml('inst-float'); document.body.appendChild(d.firstChild); return; }

/** Jam + status: ikon loading saat sedang dikirim, ✓ terkirim, ✓✓ dibaca, ⚠ gagal. */

function addMsgs(msgs) {

      if (m.lampiran && lama.lampiran && lama.lampiran.preview) m.lampiran.preview = lama.lampiran.preview;

/* ---------- Media: putar langsung (tanpa login Google, tanpa unduh) ---------- */
const videoUrl = id => 'https://drive.usercontent.google.com/download?id=' + id + '&export=download&confirm=t';
const MEDIA = {};
function b64ToU8(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
/** Ambil file dari server aplikasi (bagian demi bagian) lalu jadikan URL lokal — dipakai bila tautan Drive tidak bisa diputar. */
function mediaBlob(id) {
  if (MEDIA[id]) return MEDIA[id];
  MEDIA[id] = (async () => {
    const r0 = await rawApi('media.get', { id: id, part: 0 }, true);
    const bufs = new Array(r0.parts); bufs[0] = b64ToU8(r0.data);
    let next = 1;
    const kerja = async () => { while (next < r0.parts) { const i = next++; const r = await rawApi('media.get', { id: id, part: i }, true); bufs[i] = b64ToU8(r.data); } };
    await Promise.all([kerja(), kerja(), kerja()]);
    return URL.createObjectURL(new Blob(bufs, { type: r0.mime }));
  })();
  MEDIA[id].catch(() => { delete MEDIA[id]; });
  return MEDIA[id];
}
function mediaFallback(el, id) {
  if (!el || !id || el.dataset.fb) return;
  el.dataset.fb = '1';
  const w = el.closest('.att,.stmedia'); if (w) w.classList.add('memuat');
  mediaBlob(id).then(url => {
    if (w) w.classList.remove('memuat');
    el.src = url; el.style.opacity = '';
    if (el.tagName === 'VIDEO' && el.dataset.auto) el.play().catch(() => {});
  }).catch(() => { if (w) { w.classList.remove('memuat'); w.classList.add('gagal'); } el.style.opacity = '.3'; });
}
/** Elemen video yang langsung bisa diputar di dalam aplikasi. */
function videoTag(src, id, auto) {
  return '<video playsinline controls preload="metadata"' + (auto ? ' autoplay data-auto="1"' : '') + ' src="' + esc(src) + '"' +
    (id ? ' data-mid="' + esc(id) + '" onerror="mediaFallback(this,\'' + esc(id) + '\')" onloadstart="videoJaga(this)"' : '') + '></video>';
}
/** Bila video Drive tidak mulai dimuat dalam 8 detik, ambil lewat server aplikasi. */
function videoJaga(v) {
  if (v.dataset.jg) return; v.dataset.jg = '1';
  setTimeout(() => { if (document.contains(v) && !v.dataset.fb && v.readyState === 0) mediaFallback(v, v.dataset.mid); }, 8000);
}

const driveImg = id => 'https://lh3.googleusercontent.com/d/' + id;
const driveView = id => 'https://drive.google.com/file/d/' + id + '/view';
function ukuran(n) { n = +n || 0; return n >= 1048576 ? (n / 1048576).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function labelJenis(j) { return j === 'foto' ? '📷 Foto' : j === 'video' ? '🎬 Video' : j === 'dokumen' ? '📄 Dokumen' : ''; }
function kutipLokal(id) {

function bubbleHtml(m) {

    (st.jenis === 'foto' ? '📷 Foto' : '🎬 Video') + (st.caption ? ' • ' + esc(st.caption) : '') + '</span>' +
    (st.jenis === 'foto' && st.file ? '<img src="' + esc(driveImg(st.file)) + '" alt="" referrerpolicy="no-referrer" onerror="mediaFallback(this,\'' + esc(st.file) + '\')">' : '') + '</span>';
  const a = m.dihapus ? null : m.lampiran;

    else if (a.jenis === 'video') h += '<span class="att vid2">' + videoTag(a.preview || (a.id ? videoUrl(a.id) : ''), a.id, false) + '<span class="vsz">🎬 ' + esc(ukuran(a.ukuran)) + '</span></span>';
    else { const ext = (String(a.nama || '').split('.').pop() || 'DOK').slice(0, 4).toUpperCase();
      h += '<span class="doc" data-open="' + esc(a.id ? driveView(a.id) : '') + '"><span class="di">' + esc(ext) + '</span><span class="grow"><span class="dn">' + esc(a.nama) + '</span><span class="ds">' + esc(ukuran(a.ukuran)) + ' • Ketuk untuk membuka</span></span></span>'; }
  }

}
/** Geser pesan ke kanan untuk membalas (di komputer: klik dua kali). */
function pasangGeser(box) {
  if (!box || box.dataset.geser) return; box.dataset.geser = '1';
  let g = null;

/** Pilihan bawaan absen jamaah: tanggal & waktu shalat sesuai jam sekarang. */
function jamaahBawaan(akses) {
  const jam = new Date().getHours();
  const sesi = jam < 11 ? 'Subuh' : jam < 15 ? 'Zuhur' : jam < 18 ? 'Ashar' : jam < 19 ? 'Maghrib' : 'Isya';
  const tb = akses && !akses.kabag ? akses.tanggal : null;
  return { sesi: sesi, tanggal: tb ? (tb.indexOf(todayStr()) >= 0 ? todayStr() : tb[0]) : todayStr(), kelas: S.B.kelas[0].nama };
}
async function tJamaahInput(h, akses) {
  const a = S.ui.jm = S.ui.jm || {};
  a.mode = a.mode || 'kelas';
  const tglBoleh = akses.kabag ? null : akses.tanggal;
  const bw = jamaahBawaan(akses);
  if (!a.tanggal || (tglBoleh && tglBoleh.indexOf(a.tanggal) < 0)) a.tanggal = bw.tanggal;
  if (!a.sesi) a.sesi = bw.sesi;
  let asrama = [];
  if (a.mode === 'asrama') { try { asrama = (await api('asrama.list', {})).asrama; } catch (e) {} if (!a.asrama || !asrama.some(x => x.id === a.asrama)) a.asrama = asrama[0] ? asrama[0].id : ''; }
  if (!a.kelas) a.kelas = bw.kelas;
  if (akses.haris && !akses.kabag) h += '<div class="card hcard small">' + ic('shield') + ' Anda Haris Kelompok ' + akses.kelompok + ' yang sedang bertugas (' + esc(akses.periode.hari) + ' 18.00 – ' + esc(akses.periode.hariSelesai) + ' 18.00).</div>';
  S.ui.jmMode = a.mode;
  h += '<div class="card">' + seg('jmMode', [['kelas', 'Per Kelas'], ['asrama', 'Per Asrama']], "S.ui.jm.mode=S.ui.jmMode;refresh()").replace('class="seg"', 'class="seg" style="margin-bottom:12px"') +
    '<div class="row"><div class="f grow"><label>Tanggal</label>' + (tglBoleh ? sel('jmt', tglBoleh.map(x => [x, tgl(x)]), a.tanggal, 'onchange="S.ui.jm.tanggal=this.value;refresh()"') : inp('jmt', a.tanggal, 'type="date" onchange="S.ui.jm.tanggal=this.value;refresh()"')) + '</div>' +
    '<div class="f grow"><label>Waktu Shalat</label>' + sel('jms', ['Subuh', 'Zuhur', 'Ashar', 'Maghrib', 'Isya'].map(x => [x, x]), a.sesi, 'onchange="S.ui.jm.sesi=this.value;refresh()"') + '</div></div>' +
    (a.mode === 'asrama' ? fld('Asrama', asrama.length ? sel('jma', asrama.map(x => [x.id, x.jenis + ' • Asrama ' + x.nomor + (x.nama ? ' – ' + x.nama : '')]), a.asrama, 'onchange="S.ui.jm.asrama=this.value;refresh()"') : '<div class="muted small">Belum ada asrama.</div>')
      : fld('Kelas', sel('jmk', kelasOpts(), a.kelas, 'onchange="S.ui.jm.kelas=this.value;refresh()"'))) + '</div>';
  if (a.mode === 'asrama' && !a.asrama) return h;
  const f = await api('jamaah.form', a.mode === 'asrama' ? { tanggal: a.tanggal, sesi: a.sesi, mode: 'asrama', asrama: a.asrama } : { tanggal: a.tanggal, sesi: a.sesi, mode: 'kelas', kelas: a.kelas });
  S.ui.absItems = {}; f.items.forEach(x => S.ui.absItems[x.username] = x.status);
  h += '<div class="sec"><h3>Shalat ' + esc(a.sesi) + ' • ' + f.items.length + ' santri</h3><button class="link" onclick="semuaHadir()">Semua Hadir</button></div>';

    let g = ''; if (a.mode === 'asrama' && x.kelas !== last) { last = x.kelas; g = '<div class="grp">' + esc(x.kelas || 'Tanpa kelas') + '</div>'; }
    return g + '<div class="it" style="cursor:default"><div class="grow"><div class="t ell">' + (i + 1) + '. ' + esc(x.nama) + '</div></div>' +
      '<div class="tg" data-u="' + esc(x.username) + '">' + [['H', 'H'], ['I', 'I/S'], ['A', 'A']].map(sx => '<button class="' + sx[0] + (x.status === sx[0] ? ' on' : '') + '" onclick="setAbs(this,\'' + sx[0] + '\')">' + sx[1] + '</button>').join('') + '</div></div>'; }).join('') : empty('Tidak ada santri.', 'users')) + '</div></div>';

  return h;

async function simpanJamaah(btn) {

    '<div class="psl-media">' + (opt.judul ? '<span class="psl-tag">' + esc(opt.judul) + '</span><span class="psl-n" id="pslN"></span>' : '') + '<div class="psl-bg"></div><img class="psl-img" alt=""><img class="psl-img" alt=""><div class="psl-bars"></div>' +

  function gambar() {
    const x = items[pi], id = x.banner[bi] || x.banner[0];

    $('.psl-bars', el).innerHTML = x.banner.length > 1 ? x.banner.map((z, i) => '<span class="' + (i < bi ? 'full' : i === bi ? 'run' : '') + '"><i></i></span>').join('') : '';
  }
  function info() {
    const x = items[pi];

    meta.innerHTML = '<div class="row psl-who"><span onclick="pubProfil(\'' + esc(x.username) + '\')">' + avatar(x, 'sm') + '</span><div class="grow" style="min-width:0"><div class="b ell">' + esc(x.nama) + (x.v ? VBADGE : '') +

    if (t && m && t.scrollHeight > t.clientHeight + 2) m.classList.remove('hide');
    if (m) m.onclick = () => { jeda = true; const d = sheet(x.nama, '<div class="small muted" style="margin:-6px 0 10px">@' + esc(x.username) + ' • ' + esc(x.tanggal) + '</div><div class="tjus" style="line-height:1.6">' + teksRapi(x.teks) + '</div>'); tutupSheet(d); };
    $$('[data-a]', meta).forEach(b => b.onclick = () => aksi(b.dataset.a));
    $('.psl-dots', el).innerHTML = items.length > 1 ? items.map((z, i) => '<i class="' + (i === pi ? 'on' : '') + '" data-i="' + i + '"></i>').join('') : '';
    $$('.psl-dots i', el).forEach(d => d.onclick = () => { pi = +d.dataset.i; bi = 0; tampilkan(true); });
    const n = $('#pslN', el); if (n) n.textContent = (pi + 1) + '/' + items.length;
  }
  const tutupSheet = d => { const s = d.closest ? d.closest('.scrim') || d : d; const ob = new MutationObserver(() => { if (!document.contains(s)) { jeda = false; ob.disconnect(); } }); ob.observe(document.body, { childList: true }); };
  function tampilkan(ganti) { gambar(); if (ganti) info(); mulai(); }

  return {
    el: el, stop: () => clearInterval(tm), posisi: () => ({ id: items[pi].id, bi: bi }),

/* ---------- notifikasi pesan baru ---------- */
function startPolls() {
  stopPolls();
  pollUnread();
  S.polls.unread = setInterval(pollUnread, 12000);
  if (BR && BR.takeBack) S.polls.back = setInterval(() => { try { if (BR.takeBack()) { if (!back()) BR.exitApp(); } } catch (e) {} }, 200);
  try { if (!BR && window.Notification && Notification.permission === 'default') setTimeout(() => Notification.requestPermission(), 4000); } catch (e) {}
}
function stopPolls() { Object.keys(S.polls).forEach(k => { clearInterval(S.polls[k]); S.polls[k] = null; }); }
async function pollUnread() {
  if (!S.token || !S.B || document.hidden) return;
  if (!isOnline()) { setOnline(false); return; }
  if (Q.mine().some(x => !x.err)) flush();
  try {
    const r = await api('chat.unread', {}, true);
    const prev = S.unread; S.unread = r.count;
    if (r.count !== prev) topBar();
    if (r.baru) setBaru(r.baru);
    if (r.notif) {
      setNotifSaya(r.notif.belum || 0);
      const x = r.notif.latest && r.notif.latest[0];
      if (x && store.get('alhuda_notif_saya') !== x.id) { store.set('alhuda_notif_saya', x.id); notify(x.judul, x.isi, '__notif', 'n' + x.id); }
    }
    const n = r.latest[0];
    if (n && n.id !== S.lastNotif && !(S.thread && S.thread.with.toLowerCase() === n.dari.toLowerCase())) {
      const seen = store.get('alhuda_notif');
      S.lastNotif = n.id;
      if (seen !== n.id) { store.set('alhuda_notif', n.id); notify('Pesan baru dari ' + n.nama, n.pesan, n.dari, n.id); }
    }
  } catch (e) {}
}
/** Notifikasi pesan baru: tampil di notifikasi HP (bagian atas layar), bukan di bawah aplikasi. */
function notify(title, body, from, id) {
  try { if (BR && BR.notify) { BR.notify(title, body, String(id || '')); return; } } catch (e) {}
  try {
    if (window.Notification && Notification.permission === 'granted') { new Notification(title, { body: body, tag: 'alhuda-chat', icon: 'icons/icon-192.png', data: { from: from } }); return; }
  } catch (e) {}
  // cadangan (izin notifikasi belum diberikan): spanduk di bagian atas layar
  const old = $('.nbanner'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'nbanner';
  t.innerHTML = '<span class="nic">' + ic(from === '__notif' ? 'bell' : 'chat') + '</span><span class="grow"><b>' + esc(title) + '</b><span>' + esc(String(body).slice(0, 90)) + '</span></span>';
  t.onclick = () => { t.remove(); if (from === '__notif') openPemberitahuan(); else chatWith(from); }; document.body.appendChild(t); setTimeout(() => t.classList.add('out'), 4500); setTimeout(() => t.remove(), 5000);
}
/** Versi web: minta izin notifikasi HP sekali, setelah pengguna menyentuh layar. */
(function () {
  let sudah = false;
  const minta = () => {
    if (sudah) return; sudah = true;
    try { if (!(BR && BR.notify) && window.Notification && Notification.permission === 'default' && S.token) Notification.requestPermission(); } catch (e) {}
  };
  document.addEventListener('click', minta, { once: true, capture: true });
})();
document.addEventListener('input', e => { const v = $('#view'); if (v && v.contains(e.target) && !e.target.closest('.search')) S.dirty = true; });
document.addEventListener('change', e => { const v = $('#view'); if (v && v.contains(e.target) && e.target.tagName !== 'SELECT') S.dirty = true; });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.B) pollUnread(); });

function temaUbah(bg) {
  const t = S.ui.tm; t.pri = val('tm1'); t.pri2 = val('tm2'); if (bg) t.bg = val('tmb');
  if (!TEMA_PRESET.some(x => x[1] === t.pri && x[2] === t.pri2) && TEMA_PRESET.some(x => x[0] === t.nama)) { t.nama = 'Kustom'; $('#tmn').value = 'Kustom'; }
  $('#tmPrev').innerHTML = temaPrevHtml(t); $$('.swatch .sw').forEach(x => x.classList.remove('on'));
}
async function temaSimpan(btn, bawaan) {
  const t = S.ui.tm, tema = bawaan ? null : { nama: t.nama || 'Kustom', pri: t.pri, pri2: t.pri2, bg: t.bg };
  if (bawaan && !(await ask('Kembalikan ke tema bawaan (Hijau Al-Huda) dan buka kunci tema?', 'Kembalikan'))) return;
  busy(btn, true);
  try {
    const r = await api('dev.tema.save', { tema: tema, kunci: bawaan ? false : t.kunci });
    S.B.settings.tema = r.tema; S.B.settings.tema_kunci = r.tema_kunci; cset(ckey('boot', {}), S.B, 'boot', {});
    simpanTampilanLokal(S.B.settings); topBar();
    toast(bawaan ? 'Tema bawaan dikembalikan.' : 'Tema disimpan untuk semua pengguna.', 'ok');
    if (bawaan) { openTemaDev(); S.stack.splice(-2, 1); } else busy(btn, false);
  } catch (e) { toast(e.message, 'err'); busy(btn, false); }
}

/* ---------- tentang aplikasi ---------- */
const TENTANG_ISIAN = [['nama_mobile', 'Nama aplikasi di ponsel'], ['nama_web', 'Nama aplikasi di komputer'], ['versi', 'Versi aplikasi'], ['tentang_aplikasi', 'Deskripsi aplikasi', 1],
  ['tentang_pemilik', 'Pemilik'], ['tentang_alamat', 'Alamat'], ['tentang_pembuat', 'Dibuat oleh'], ['penerbit', 'Penerbit'], ['tanggal_revisi', 'Tanggal revisi'], ['tentang_kontak', 'Kontak pengembang (WhatsApp / email)']];
function openTentangDev() { push('Tentang Aplikasi', pTentangDev, { sub: 'Isi halaman Tentang Aplikasi' }); }
async function pTentangDev() {
  const t = loading(5); const list = await api('settings.get'); if (!alive(t)) return;
  const m = {}; list.forEach(x => m[x.kunci] = x.nilai || '');
  view('<div class="card noganti">' + TENTANG_ISIAN.map(x => fld(x[1], x[2]
      ? '<textarea class="in" id="ta_' + x[0] + '" style="min-height:160px">' + esc(String(m[x[0]] || '').replace(/\\n/g, '\n')) + '</textarea><div class="small muted" style="margin:4px 0 0">Pisahkan paragraf dengan baris kosong. Awali baris dengan "• " untuk daftar.</div>'
      : inp('ta_' + x[0], m[x[0]], 'maxlength="120"'))).join('') +
    '<button class="btn full" onclick="tentangSimpan(this)">' + ic('check') + ' Simpan</button>' +
    '<button class="btn sec full" style="margin-top:8px" onclick="openTentang()">' + ic('eye') + ' Lihat Halaman Tentang</button></div>');
}
async function tentangSimpan(btn) {
  const v = {}; TENTANG_ISIAN.forEach(x => v[x[0]] = ($('#ta_' + x[0]).value || '').trim());
  if (!v.nama_mobile || !v.nama_web) return toast('Nama aplikasi tidak boleh kosong.', 'err');
  busy(btn, true);
  try { await api('settings.save', { values: v }); Object.assign(S.B.settings, v); cset(ckey('boot', {}), S.B, 'boot', {}); topBar(); const nb = $('#nbrand'); if (nb) nb.innerHTML = brandHtml(); toast('Tentang Aplikasi disimpan.', 'ok'); }
  catch (e) { toast(e.message, 'err'); }
  busy(btn, false);
}

/* ---------- sebutan lembaga ---------- */
function openIstilahLembaga() {
  const cur = istilahLembaga();
  const d = sheet('Sebutan Lembaga', '<div class="noganti"><div class="small muted" style="margin-bottom:12px">Kata <b>"Dayah"</b> di seluruh aplikasi, halaman login, pesan sistem & PDF diganti dengan sebutan ini. Huruf besar-kecil menyesuaikan (Dayah → Pesantren, DAYAH → PESANTREN).</div>' +
    fld('Sebutan lembaga', inp('ilv', cur, 'maxlength="30" placeholder="Mis. Pesantren"')) +
    '<div class="row" style="gap:6px;flex-wrap:wrap;margin:-4px 0 14px">' + ['Dayah', 'Pesantren', 'Pondok', 'Madrasah', 'Sekolah', 'Ma\'had'].map(x => '<button class="chip" onclick="$(\'#ilv\').value=this.textContent">' + x + '</button>').join('') + '</div>' +
    '<div class="small muted" style="margin-bottom:12px">Nama lembaga (mis. "Dayah Al-Huda Malikussaleh") dapat diubah di Pengaturan Aplikasi → nama_dayah & nama_yayasan.</div>' +
    '<button class="btn full" id="ilsv">Simpan</button></div>');
  $('#ilsv', d).onclick = async e => {
    const v = val('ilv'); if (!v) return toast('Sebutan tidak boleh kosong.', 'err');
    if (/dayah/i.test(v) && v.toLowerCase() !== 'dayah') return toast('Sebutan tidak boleh mengandung kata "dayah". Pilih "Dayah" saja atau kata lain.', 'err');
    busy(e.target, true);
    try {
      await api('settings.save', { values: { istilah_lembaga: v } });
      S.B.settings.istilah_lembaga = v; cset(ckey('boot', {}), S.B, 'boot', {}); store.set('alhuda_istilah_lembaga', v);
      closeSheet(); mulaiGantiKata(); topBar(); const nb = $('#nbrand'); if (nb) nb.innerHTML = brandHtml(); refresh();
      toast('Sebutan lembaga disimpan.', 'ok');
    } catch (z) { toast(z.message, 'err'); busy(e.target, false); }
  };
}

/* ---------- login khusus pengembang ---------- */
function openLoginDev() { push('Login Khusus Pengembang', pLoginDev, { sub: 'Masuk tanpa akun di sheet Users' }); }
async function pLoginDev() {
  const t = loading(3); const d = S.ui.ldBaru || await rawApi('dev.login.get'); S.ui.ldBaru = null; if (!alive(t)) return;
  S.ui.ld = d;
  const pw = (id, l) => fld(l, '<div class="pw"><input class="in" id="' + id + '" type="password" autocomplete="new-password"><button class="eye" type="button" onclick="togglePw(\'' + id + '\',this)">' + ic('eye') + '</button></div>');
  view('<div class="card hcard small" style="display:flex;gap:10px;align-items:flex-start">' + ic('lock') + '<span>Akun ini <b>tidak tersimpan di Google Sheet</b>, melainkan di <b>Script Properties</b> Apps Script, sehingga tetap aman walau Sheet dibagikan. Akun ini memiliki semua akses Pengembang & Admin. Salah sandi 5 kali → login dikunci 15 menit.</span></div>' +
    '<div class="card"><div class="row" style="gap:10px;margin-bottom:12px"><div class="av sm" style="background:var(--soft);color:var(--pri2)">' + ic('user') + '</div><div class="grow"><div class="b">' + (d.ada ? '@' + esc(d.username) : 'Belum dibuat') + '</div><div class="small muted">' +
      (d.ada ? (d.aktif ? 'Aktif — dapat dipakai untuk login' : 'Nonaktif — tidak dapat dipakai login') : 'Buat username & kata sandi di bawah') + '</div></div>' +
      (d.ada ? '<span class="st ' + (d.aktif ? 'H' : 'A') + '">' + (d.aktif ? 'Aktif' : 'Nonaktif') + '</span>' : '') + '</div>' +
    fld('Username', inp('ldu', d.username || 'pengembang', 'maxlength="30" autocapitalize="none"' + (d.sedangDipakai ? ' disabled' : ''))) +
    pw('ldp', d.ada ? 'Kata sandi baru (kosongkan bila tidak diganti)' : 'Kata sandi (min. 8 karakter)') + pw('ldq', 'Ulangi kata sandi') +
    '<label class="row" style="gap:10px;margin:4px 0 14px;cursor:pointer"><input type="checkbox" id="lda"' + (!d.ada || d.aktif ? ' checked' : '') + (d.sedangDipakai ? ' disabled' : '') + ' style="width:18px;height:18px;accent-color:var(--pri2)"><span><b>Aktifkan login khusus</b></span></label>' +
    '<button class="btn full" onclick="loginDevSimpan(this)">' + ic('check') + ' Simpan</button></div>' +
    '<div class="muted small" style="padding:0 4px">Cara lain: di editor Apps Script → Setelan Project → Properti skrip, isi <b>DEV_USER</b> dan <b>DEV_PASS</b>. Sandi otomatis dienkripsi saat login pertama.</div>');
}
async function loginDevSimpan(btn) {
  const p = { username: val('ldu').toLowerCase(), password: $('#ldp').value, aktif: $('#lda').checked };
  if (p.password !== $('#ldq').value) return toast('Ulangi kata sandi tidak cocok.', 'err');
  if (!S.ui.ld.ada && p.password.length < 8) return toast('Kata sandi minimal 8 karakter.', 'err');
  if (!p.password) delete p.password;
  busy(btn, true);
  try { const r = await api('dev.login.save', p); if (r.token) setToken(r.token); S.ui.ldBaru = r; toast('Login khusus pengembang disimpan.', 'ok'); refresh(); }
  catch (e) { toast(e.message, 'err'); busy(btn, false); }
}

/* ---------- alamat server (URL Web App) ---------- */
function hostServer(u) { const m = String(u || '').match(/\/macros\/s\/([\w-]{6})[\w-]*\/exec/); return m ? 'Web App …' + m[1] + '…/exec' : String(u || '').replace(/^https:\/\//, '').slice(0, 40); }
function formServer(id) {
  return '<div class="noganti">' + fld('URL Web App', '<textarea class="in" id="' + id + '" style="min-height:76px;font-size:13px" autocapitalize="none" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">' + esc(urlServerLokal() || API_URL || '') + '</textarea>') +
    '<div class="small muted" style="margin:-4px 0 12px">Salin dari Apps Script: <b>Terapkan → Kelola penerapan → URL Aplikasi web</b> (berakhiran <b>/exec</b>). Untuk lembaga lain, salin Sheet & Apps Script, terapkan, lalu masukkan URL-nya di sini.</div>' +
    '<div id="' + id + 'Hasil"></div>' +
    '<button class="btn sec full" onclick="ujiServerBtn(this,\'' + id + '\')">' + ic('wifioff') + ' Uji Koneksi</button>' +
    '<button class="btn full" style="margin-top:8px" onclick="simpanServer(this,\'' + id + '\')">' + ic('check') + ' Simpan & Hubungkan</button>' +
    (urlServerLokal() && (BR && BR.apiUrl || window.ALHUDA_API_URL) ? '<button class="btn sec full" style="margin-top:8px" onclick="resetServer()">' + ic('repeat') + ' Kembalikan ke Server Bawaan</button>' : '') + '</div>';
}
function openServer() {
  if (HAS_GAS) return sheet('Alamat Server', '<div class="card hcard small">' + ic('info') + ' Aplikasi ini sedang dibuka langsung dari Apps Script, sehingga selalu terhubung ke server ini. Alamat server diatur pada aplikasi Android / web (ALHUDA WEB).</div>');
  sheet('Alamat Server (URL Web App)', '<div class="small" style="margin-bottom:10px">Server saat ini: <b>' + esc(hostServer(API_URL) || 'belum diatur') + '</b>' + (urlServerLokal() ? ' (diatur di perangkat ini)' : '') + '</div>' + formServer('srvU'));
}
/** Dibuka saat aplikasi belum memiliki alamat server sama sekali. */
function halamanServer() {
  $('#app').classList.remove('shell');
  $('#app').innerHTML = '<div class="login"><div class="hd"><div class="lg">' + LOGO_SVG + '</div><h1>' + esc(appName({})) + '</h1><div class="yy" style="margin-bottom:0">Pengaturan awal server</div></div>' +
    '<div class="card lcard"><div class="b" style="font-size:16px;margin-bottom:2px">Hubungkan ke Server</div><div class="muted small" style="margin-bottom:14px">Aplikasi belum terhubung ke server lembaga. Masukkan URL Web App Google Apps Script milik lembaga Anda.</div>' + formServer('srvA') + '</div></div>';
  tataLogin();
}
async function ujiServer(url) {
  if (!/^https:\/\/\S+$/.test(url)) throw new Error('URL harus diawali https:// dan tanpa spasi.');
  let txt;
  try { txt = await fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'publicInfo', params: {} }) }).then(r => r.text()); }
  catch (e) { throw new Error('Tidak dapat terhubung. Periksa URL dan koneksi internet.'); }
  const r = parseServer(txt);
  if (!r.ok) throw new Error(r.error);
  if (!r.data || !r.data.nama_aplikasi) throw new Error('Server terhubung, tetapi bukan server ALHUDA MOBILE.');
  return r.data;
}
async function ujiServerBtn(btn, id) {
  const box = $('#' + id + 'Hasil'); busy(btn, true);
  try { const i = await ujiServer(val(id)); box.innerHTML = '<div class="card vok small" style="margin-bottom:10px">' + ic('check') + ' Terhubung: <b>' + esc(i.nama_yayasan || i.nama_aplikasi) + '</b></div>'; }
  catch (e) { box.innerHTML = '<div class="card vwarn small" style="margin-bottom:10px">' + ic('info') + ' ' + esc(e.message) + '</div>'; }
  busy(btn, false);
}
function pindahServer(url) {
  store.set('alhuda_api_url', url || null);
  try { BR && BR.setApiUrl && BR.setApiUrl(url || ''); } catch (e) {}
  ['alhuda_token', 'alhuda_tema_app', 'alhuda_tema_kunci', 'alhuda_istilah_lembaga'].forEach(k => store.set(k, null));
  try { BR && BR.setToken && BR.setToken(''); } catch (e) {}
  try { Object.keys(localStorage).filter(k => k.indexOf('alhuda_unduh_') === 0 || k.indexOf('c:') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  toast('Server diganti. Memuat ulang…', 'ok');
  setTimeout(() => location.reload(), 900);
}
async function simpanServer(btn, id) {
  const url = val(id), box = $('#' + id + 'Hasil');
  busy(btn, true);
  let info;
  try { info = await ujiServer(url); } catch (e) { box.innerHTML = '<div class="card vwarn small" style="margin-bottom:10px">' + ic('info') + ' ' + esc(e.message) + '</div>'; return busy(btn, false); }
  busy(btn, false);
  if (url === API_URL && urlServerLokal()) return toast('Server ini sudah dipakai.', 'ok');
  if (!(await ask('Hubungkan aplikasi ke server "' + (info.nama_yayasan || info.nama_aplikasi) + '"?' + (S.token ? ' Anda akan keluar dari akun dan perlu login kembali.' : ''), 'Hubungkan'))) return;
  pindahServer(url);
}
async function resetServer() {
  if (!(await ask('Kembalikan ke server bawaan aplikasi? Anda akan keluar dari akun.', 'Kembalikan'))) return;
  pindahServer('');
}

/* ---------- mulai ---------- */
(function init() {
  try { BR && BR.ready && BR.ready(); } catch (e) {}
  applyTheme(store.get('alhuda_theme') || 'terang');
  mulaiGantiKata();
  if (!HAS_GAS && !NATIVE && !API_URL) return halamanServer();
  let t = store.get('alhuda_token');
  try { if (!t && BR && BR.getToken) t = BR.getToken() || null; } catch (e) {}
  if (t) { S.token = t; startApp(); } else showLogin();
})();
</script>
